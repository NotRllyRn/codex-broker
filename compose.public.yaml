services:
  broker:
    environment:
      WINDOWKEEPER_PUBLIC_ENROLLMENT_ENABLED: "true"
      WINDOWKEEPER_PUBLIC_ENROLLMENT_KEY: ${WINDOWKEEPER_PUBLIC_ENROLLMENT_KEY:?Set WINDOWKEEPER_PUBLIC_ENROLLMENT_KEY in .env}
    networks:
      default:
        aliases:
          - codex-broker

  public-enrollment:
    build: .
    command: ["public-serve"]
    restart: unless-stopped
    depends_on:
      broker:
        condition: service_healthy
    environment:
      WINDOWKEEPER_PUBLIC_ENROLLMENT_ENABLED: "true"
      WINDOWKEEPER_PUBLIC_ENROLLMENT_KEY: ${WINDOWKEEPER_PUBLIC_ENROLLMENT_KEY:?Set WINDOWKEEPER_PUBLIC_ENROLLMENT_KEY in .env}
      WINDOWKEEPER_PUBLIC_ENROLLMENT_BROKER_URL: https://codex-broker:8787
      WINDOWKEEPER_PUBLIC_ENROLLMENT_CA_CERT: /certs/broker-ca.crt
      WINDOWKEEPER_PUBLIC_ENROLLMENT_HOST: 0.0.0.0
      WINDOWKEEPER_PUBLIC_ENROLLMENT_PORT: "8788"
      WINDOWKEEPER_PUBLIC_ENROLLMENT_TLS_CERT_FILE: /certs/public.crt
      WINDOWKEEPER_PUBLIC_ENROLLMENT_TLS_KEY_FILE: /certs/public.key
    ports:
      - "${CODEX_BROKER_PUBLIC_BIND_ADDRESS:-0.0.0.0}:${CODEX_BROKER_PUBLIC_PORT:-8788}:8788"
    volumes:
      - ./deployment/certs/ca.crt:/certs/broker-ca.crt:ro
      - ${CODEX_BROKER_PUBLIC_TLS_CERT_FILE:?Set the public TLS certificate path}:/certs/public.crt:ro
      - ${CODEX_BROKER_PUBLIC_TLS_KEY_FILE:?Set the public TLS private-key path}:/certs/public.key:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8788), 2).close()",
        ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
