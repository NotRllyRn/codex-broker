services:
  broker:
    build: .
    init: true
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    expose: [8787]
    environment:
      WINDOWKEEPER_COOKIE_SECURE: "true"
      WINDOWKEEPER_BROWSER_OAUTH_MODE: ${WINDOWKEEPER_BROWSER_OAUTH_MODE:-manual}
      WINDOWKEEPER_VAULT_KEY: ${WINDOWKEEPER_VAULT_KEY:?Run scripts/bootstrap.sh first}
      WINDOWKEEPER_ADMIN_PASSWORD: ${WINDOWKEEPER_ADMIN_PASSWORD:?Run scripts/bootstrap.sh first}
    volumes:
      - broker-data:/data
    tmpfs:
      - /run/windowkeeper:uid=10001,gid=10001,mode=0700,size=512m
      - /tmp:uid=10001,gid=10001,mode=0700,size=128m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health/ready', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"

  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      broker:
        condition: service_healthy
    ports:
      - "${CODEX_BROKER_BIND_ADDRESS:-0.0.0.0}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deployment/certs:/certs:ro
    tmpfs:
      - /config
      - /data

volumes:
  broker-data: {}
